# Cron diário: reconciliação Asaas (recupera webhooks perdidos / cobranças)
#
# Secrets obrigatórios no repositório GitHub (Settings → Secrets → Actions):
#   SUPABASE_PROJECT_URL  → https://jahjwuydesfytlmjwucx.supabase.co
#   CRON_SECRET           → o mesmo valor do secret CRON_SECRET no Supabase
#
# Agenda: todo dia 09:30 UTC (~06:30 BRT). Também pode rodar manualmente.

name: Reconcile Asaas Billing

on:
  schedule:
    - cron: "30 9 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Validate required secrets
        env:
          SUPABASE_PROJECT_URL: ${{ secrets.SUPABASE_PROJECT_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$SUPABASE_PROJECT_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "::error::Configure SUPABASE_PROJECT_URL e CRON_SECRET em Settings → Secrets → Actions."
            exit 1
          fi

      - name: Reconcile Asaas payments
        env:
          SUPABASE_PROJECT_URL: ${{ secrets.SUPABASE_PROJECT_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          curl --fail-with-body --silent --show-error \
            --retry 2 --retry-all-errors \
            --max-time 120 \
            -X POST "$SUPABASE_PROJECT_URL/functions/v1/asaas-reconcile" \
            -H "Authorization: Bearer $CRON_SECRET" \
            -H "Content-Type: application/json" \
            --data '{"limit":50}'

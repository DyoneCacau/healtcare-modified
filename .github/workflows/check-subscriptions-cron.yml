# Cron diário: verificação de assinaturas (atraso / suspensão)
#
# Secrets obrigatórios no repositório GitHub (Settings → Secrets → Actions):
#   SUPABASE_PROJECT_URL  → https://jahjwuydesfytlmjwucx.supabase.co
#   CRON_SECRET           → o mesmo valor do secret CRON_SECRET no Supabase
#
# Agenda: todo dia 09:00 UTC (~06:00 BRT). Também pode rodar manualmente (Actions → Run workflow).

name: Check Subscriptions

on:
  schedule:
    - cron: '0 9 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Validate required secrets
        env:
          SUPABASE_PROJECT_URL: ${{ secrets.SUPABASE_PROJECT_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$SUPABASE_PROJECT_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "::error::Configure SUPABASE_PROJECT_URL e CRON_SECRET em Settings → Secrets → Actions."
            exit 1
          fi

      - name: Call check-subscriptions
        env:
          SUPABASE_PROJECT_URL: ${{ secrets.SUPABASE_PROJECT_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          curl --fail-with-body --silent --show-error \
            --retry 2 --retry-all-errors \
            --max-time 120 \
            -X POST "$SUPABASE_PROJECT_URL/functions/v1/check-subscriptions" \
            -H "Authorization: Bearer $CRON_SECRET" \
            -H "Content-Type: application/json"

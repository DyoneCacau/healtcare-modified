# Cron de hora em hora: confirmações de consultas/exames pela Suri
#
# Secrets obrigatórios no repositório GitHub (Settings → Secrets → Actions):
#   SUPABASE_PROJECT_URL  → https://jahjwuydesfytlmjwucx.supabase.co
#   CRON_SECRET           → o mesmo valor do secret CRON_SECRET no Supabase
#
# Cada clínica escolhe o horário de envio na Central de Integrações; a function
# só dispara para quem já passou do horário e não repete envios do dia.

name: Suri Reminders

on:
  schedule:
    - cron: '5 * * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Validate required secrets
        env:
          SUPABASE_PROJECT_URL: ${{ secrets.SUPABASE_PROJECT_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$SUPABASE_PROJECT_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "::error::Configure SUPABASE_PROJECT_URL e CRON_SECRET em Settings → Secrets → Actions."
            exit 1
          fi

      - name: Call suri-send-reminders
        env:
          SUPABASE_PROJECT_URL: ${{ secrets.SUPABASE_PROJECT_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          curl --fail-with-body --silent --show-error \
            --max-time 300 \
            -X POST "$SUPABASE_PROJECT_URL/functions/v1/suri-send-reminders" \
            -H "Authorization: Bearer $CRON_SECRET" \
            -H "Content-Type: application/json"

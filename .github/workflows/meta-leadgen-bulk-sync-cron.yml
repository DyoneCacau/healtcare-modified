# Cron a cada 10 min: Bulk Read Lead Ads (fallback do webhook Meta)
#
# Secrets obrigatórios no repositório GitHub (Settings → Secrets → Actions):
#   SUPABASE_PROJECT_URL  → https://<ref>.supabase.co
#   CRON_SECRET           → o mesmo valor do secret CRON_SECRET no Supabase
#
# Janela Graph: 48h (body window_hours). Também pode rodar manualmente.

name: Meta Leadgen Bulk Sync

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bulk-sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Validate required secrets
        env:
          SUPABASE_PROJECT_URL: ${{ secrets.SUPABASE_PROJECT_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$SUPABASE_PROJECT_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "::error::Configure SUPABASE_PROJECT_URL e CRON_SECRET em Settings → Secrets → Actions."
            exit 1
          fi

      - name: Run meta-leadgen-bulk-sync
        env:
          SUPABASE_PROJECT_URL: ${{ secrets.SUPABASE_PROJECT_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          curl --fail-with-body --silent --show-error \
            --retry 2 --retry-all-errors \
            --max-time 180 \
            -X POST "$SUPABASE_PROJECT_URL/functions/v1/meta-leadgen-bulk-sync" \
            -H "Authorization: Bearer $CRON_SECRET" \
            -H "Content-Type: application/json" \
            --data '{"window_hours":48}'
